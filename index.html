<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ففرو</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
:root{
  --bg:#f2e8d8;--bg2:#ecddd0;--sf:#faf5ed;--sf2:#f0e8d8;--sf3:#e8ddc8;
  --br:#d4c4a8;--br2:#c4b090;
  --brown:#5a3e20;--br2c:#7a5530;--gold:#8c6830;--gold2:#a07838;
  --grn:#3a5e40;--grn2:#4e7a56;--red:#7a2020;--red2:#9a3030;
  --mut:#8a7060;--mut2:#a89070;--tx:#2e2018;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;}

/* SETUP */
#SP{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.sbox{background:var(--sf);border:1.5px solid var(--br);border-radius:24px;padding:2.2rem 2.6rem;width:100%;max-width:400px;box-shadow:0 8px 40px rgba(90,62,32,.15);animation:fup .4s ease;text-align:center;}
.sbox .logo{font-family:'Amiri',serif;font-size:3rem;font-weight:700;color:var(--brown);letter-spacing:2px;margin-bottom:.3rem;}
.sbox p{color:var(--mut);font-size:.84rem;margin-bottom:1.5rem;}
/* LOGIN */
#LP{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:var(--bg);}
.lbox{background:var(--sf);border:1.5px solid var(--br);border-radius:24px;padding:2.2rem 2.6rem;width:100%;max-width:430px;box-shadow:0 8px 40px rgba(90,62,32,.15);animation:fup .4s ease;}
.llogo{text-align:center;margin-bottom:1.5rem;}
.llogo .lt{font-family:'Amiri',serif;font-size:2.8rem;font-weight:700;color:var(--brown);letter-spacing:2px;}
.llogo p{color:var(--mut);font-size:.83rem;margin-top:3px;}
.ltabs{display:flex;gap:3px;background:var(--sf2);border-radius:11px;padding:3px;border:1px solid var(--br);margin-bottom:1.4rem;}
.ltab{flex:1;padding:7px;border:none;background:transparent;color:var(--mut);font-family:'Tajawal',sans-serif;font-size:.83rem;cursor:pointer;border-radius:8px;transition:all .2s;}
.ltab.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 5px rgba(90,62,32,.1);}
/* FORMS */
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:.9rem;}
.fg label{font-size:.76rem;color:var(--mut);}
.fg input,.fg select,.fg textarea{background:var(--sf2);border:1px solid var(--br);border-radius:10px;padding:9px 13px;color:var(--tx);font-family:'Tajawal',sans-serif;font-size:.88rem;outline:none;transition:border-color .2s;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold2);}
.fg select option{background:var(--sf2);}
.mbtn{width:100%;padding:11px;border:none;border-radius:11px;background:linear-gradient(135deg,var(--brown),var(--gold2));color:#fff;font-family:'Cairo',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(90,62,32,.22);margin-top:.3rem;}
.mbtn:hover{opacity:.88;}
.errm{color:var(--red2);font-size:.78rem;margin-top:.4rem;display:none;text-align:center;}
/* APP */
#APP{display:none;}
/* HEADER */
header{position:sticky;top:0;z-index:300;background:rgba(242,232,216,.95);backdrop-filter:blur(16px);border-bottom:1.5px solid var(--br);padding:0 1.5rem;height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.hlogo{font-family:'Amiri',serif;font-size:1.6rem;font-weight:700;color:var(--brown);letter-spacing:1px;white-space:nowrap;}
.hcenter{display:flex;gap:6px;align-items:center;flex:1;justify-content:center;flex-wrap:wrap;}
.hbtn{padding:5px 12px;border-radius:18px;border:1px solid var(--br);background:transparent;color:var(--mut);font-family:'Tajawal',sans-serif;font-size:.76rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px;white-space:nowrap;}
.hbtn:hover,.hbtn.on{border-color:var(--gold2);color:var(--brown);background:rgba(90,62,32,.07);}
.hbtn.pri{background:linear-gradient(135deg,var(--brown),var(--gold2));color:#fff;border-color:transparent;}
.upill{display:flex;align-items:center;gap:7px;background:var(--sf);border:1px solid var(--br);border-radius:28px;padding:4px 12px 4px 7px;}
.uav{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--brown),var(--gold2));}
.uav.s{background:linear-gradient(135deg,var(--grn),var(--grn2));}
.unm{font-size:.82rem;font-weight:600;color:var(--brown);}
.logout{padding:4px 11px;border-radius:18px;border:1px solid var(--br);background:transparent;color:var(--mut);font-family:'Tajawal',sans-serif;font-size:.74rem;cursor:pointer;transition:all .2s;}
.logout:hover{border-color:var(--red2);color:var(--red2);}
/* MAIN */
#mainView{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:1.5rem;}
/* GROUP CARDS */
.gcrow{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem;}
.gcard{background:var(--sf);border:1.5px solid var(--br);border-radius:18px;padding:1.2rem 1.4rem;box-shadow:0 2px 10px rgba(90,62,32,.07);}
.gcard-top{display:flex;align-items:center;gap:10px;margin-bottom:.8rem;}
.gico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;border:1px solid var(--br);}
.gico.a{background:rgba(140,104,48,.1);}
.gico.b{background:rgba(58,94,64,.1);}
.gname-i{font-family:'Cairo',sans-serif;font-size:.98rem;font-weight:700;color:var(--brown);background:transparent;border:none;border-bottom:1.5px solid transparent;outline:none;padding:1px 2px;cursor:pointer;width:160px;transition:border-color .2s;}
.gname-i:focus{border-color:var(--gold2);cursor:text;}
.gweeks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.gwk{background:var(--sf2);border:1px solid var(--br);border-radius:10px;padding:7px 9px;text-align:center;}
.gwk-n{font-family:'Cairo',sans-serif;font-weight:700;font-size:1rem;color:var(--brown);}
.gwk-l{color:var(--mut);font-size:.66rem;margin-top:1px;}
/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:.7rem;margin-bottom:1rem;flex-wrap:wrap;}
.srch{position:relative;flex:1;min-width:160px;}
.srch input{width:100%;background:var(--sf);border:1px solid var(--br);border-radius:11px;padding:8px 14px 8px 36px;color:var(--tx);font-family:'Tajawal',sans-serif;font-size:.85rem;outline:none;transition:border-color .2s;}
.srch input:focus{border-color:var(--gold2);}
.srch input::placeholder{color:var(--mut2);}
.srch-i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut2);font-size:.82rem;}
/* INLINE POINTS TABLE */
.tcard{background:var(--sf);border:1px solid var(--br);border-radius:18px;overflow:hidden;box-shadow:0 2px 14px rgba(90,62,32,.08);}
.tcard table{width:100%;border-collapse:collapse;}
.tcard thead{background:var(--sf2);}
.tcard th{padding:10px 10px;text-align:center;font-size:.68rem;font-weight:600;color:var(--mut);border-bottom:1px solid var(--br);white-space:nowrap;}
.tcard th:first-child{text-align:right;padding-right:14px;}
.tcard tbody tr{border-bottom:1px solid var(--br);transition:background .12s;animation:frow .3s ease both;}
.tcard tbody tr:last-child{border-bottom:none;}
.tcard tbody tr:hover{background:rgba(140,104,48,.04);}
.tcard td{padding:9px 10px;font-size:.84rem;vertical-align:middle;text-align:center;}
.tcard td:first-child{text-align:right;padding-right:14px;}
@keyframes frow{from{opacity:0;transform:translateX(5px);}to{opacity:1;transform:translateX(0);}}
@keyframes fup{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
/* student name cell */
.snc{display:flex;align-items:center;gap:9px;cursor:pointer;}
.snc:hover .snm{color:var(--gold);}
.sav{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;flex-shrink:0;}
.snm{font-weight:600;font-size:.85rem;transition:color .2s;color:var(--tx);}
.scod{color:var(--mut);font-size:.68rem;}
.gtag{display:inline-block;font-size:.63rem;padding:1px 6px;border-radius:8px;margin-top:1px;}
.gtag.A{background:rgba(140,104,48,.1);color:var(--gold);}
.gtag.B{background:rgba(58,94,64,.1);color:var(--grn);}
/* inline point inputs */
.pi{width:38px;background:var(--sf2);border:1px solid var(--br);border-radius:6px;padding:4px 2px;color:var(--tx);font-family:'Cairo',sans-serif;font-weight:700;font-size:.82rem;text-align:center;outline:none;transition:border-color .2s;}
.pi:focus{border-color:var(--gold2);}
.pi.ro{opacity:.55;pointer-events:none;background:transparent;border-color:transparent;}
.tot-num{font-family:'Cairo',sans-serif;font-weight:800;font-size:.95rem;color:var(--brown);}
.day-sum{font-family:'Cairo',sans-serif;font-weight:700;font-size:.85rem;padding:3px 9px;border-radius:16px;background:rgba(90,62,32,.1);color:var(--brown);}
.gbadge{display:inline-flex;padding:2px 8px;border-radius:16px;font-family:'Cairo',sans-serif;font-weight:700;font-size:.74rem;}
.gA{background:rgba(58,94,64,.12);color:#2a6838;}.gB{background:rgba(90,62,32,.12);color:var(--gold);}
.gC{background:rgba(110,78,30,.1);color:var(--br2c);}.gD{background:rgba(122,32,32,.12);color:var(--red2);}
.star-badge{font-size:1.2rem;}
/* day selector row */
.day-row{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap;padding:0 2px;}
.day-pill{padding:5px 12px;border-radius:18px;border:1px solid var(--br);background:transparent;color:var(--mut);font-family:'Tajawal',sans-serif;font-size:.76rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px;white-space:nowrap;}
.day-pill.on{background:rgba(90,62,32,.1);border-color:var(--gold2);color:var(--brown);}
.day-pill.archived{opacity:.55;font-style:italic;}
.add-day-btn{padding:5px 12px;border-radius:18px;background:linear-gradient(135deg,var(--brown),var(--gold2));color:#fff;border:none;font-family:'Tajawal',sans-serif;font-size:.74rem;cursor:pointer;white-space:nowrap;}
/* acts */
.acts{display:flex;gap:3px;justify-content:center;}
.ab{width:27px;height:27px;border-radius:7px;border:1px solid var(--br);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.74rem;color:var(--mut);transition:all .2s;}
.ab:hover{border-color:var(--gold2);color:var(--brown);background:rgba(90,62,32,.07);}
.ab.del:hover{border-color:var(--red2);color:var(--red2);}
/* TOAST */
.toast{position:fixed;bottom:1.6rem;left:50%;transform:translateX(-50%) translateY(120px);background:linear-gradient(135deg,var(--brown),var(--gold2));color:#fff;padding:10px 20px;border-radius:36px;font-weight:600;font-size:.84rem;z-index:9999;transition:transform .28s;white-space:nowrap;box-shadow:0 5px 18px rgba(90,62,32,.22);}
.toast.on{transform:translateX(-50%) translateY(0);}
/* MODAL */
.ov{position:fixed;inset:0;z-index:500;background:rgba(42,26,12,.42);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .22s;}
.ov.open{opacity:1;pointer-events:all;}
.modal{background:var(--sf);border:1.5px solid var(--br);border-radius:22px;width:100%;max-width:820px;max-height:92vh;overflow-y:auto;transform:translateY(18px) scale(.97);transition:transform .26s;box-shadow:0 14px 55px rgba(90,62,32,.17);scrollbar-width:thin;scrollbar-color:var(--br) transparent;}
.ov.open .modal{transform:translateY(0) scale(1);}
.mhd{padding:1.3rem 1.6rem .9rem;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:.9rem;position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--sf2),var(--sf));}
.mav{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:800;flex-shrink:0;}
.mttl{flex:1;}
.mni{background:transparent;border:none;border-bottom:1.5px solid transparent;color:var(--tx);font-family:'Cairo',sans-serif;font-size:1rem;font-weight:700;outline:none;width:100%;padding:2px 0;transition:border-color .2s;cursor:default;}
.mni.ed:focus{border-color:var(--gold2);cursor:text;}
.msb{color:var(--mut);font-size:.75rem;margin-top:1px;}
.mcbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--br);background:transparent;cursor:pointer;color:var(--mut);display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:.82rem;}
.mcbtn:hover{background:var(--sf2);color:var(--tx);}
.mbdy{padding:1.3rem 1.6rem;}
.mtabs{display:flex;gap:3px;margin-bottom:1.2rem;background:var(--sf2);border-radius:11px;padding:3px;border:1px solid var(--br);}
.mtab{flex:1;padding:6px;border:none;background:transparent;color:var(--mut);font-family:'Tajawal',sans-serif;font-size:.78rem;cursor:pointer;border-radius:8px;transition:all .2s;}
.mtab.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 4px rgba(90,62,32,.1);}
/* pts modal */
.pts-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;flex-wrap:wrap;gap:6px;}
.pts-hdr h3{font-family:'Cairo',sans-serif;font-size:.9rem;font-weight:700;color:var(--tx);}
.pts-grid{display:flex;flex-direction:column;gap:6px;}
.prow{background:var(--sf2);border:1px solid var(--br);border-radius:11px;padding:9px 12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.prow.arc{opacity:.5;border-style:dashed;}
.prow.sel{border-color:var(--gold2);background:rgba(140,104,48,.06);}
.plbl{font-family:'Cairo',sans-serif;font-weight:700;font-size:.76rem;color:var(--brown);min-width:80px;}
.pfields{display:flex;gap:6px;flex:1;flex-wrap:wrap;align-items:center;}
.pf{display:flex;flex-direction:column;gap:2px;align-items:center;}
.pf label{font-size:.62rem;color:var(--mut);white-space:nowrap;}
.mpinp{width:46px;background:var(--sf);border:1px solid var(--br);border-radius:7px;padding:4px 3px;color:var(--tx);font-family:'Cairo',sans-serif;font-weight:700;font-size:.85rem;text-align:center;outline:none;transition:border-color .2s;}
.mpinp:focus{border-color:var(--gold2);}
.mpinp.ro{opacity:.6;pointer-events:none;}
.ptot{font-family:'Cairo',sans-serif;font-weight:700;font-size:.8rem;padding:3px 10px;border-radius:16px;background:rgba(90,62,32,.1);color:var(--brown);margin-right:auto;white-space:nowrap;}
.pacts{display:flex;gap:3px;}
.pab{width:24px;height:24px;border-radius:6px;border:1px solid var(--br);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.68rem;color:var(--mut);transition:all .2s;}
.pab:hover{border-color:var(--gold2);color:var(--brown);}
.pab.del:hover{border-color:var(--red2);color:var(--red2);}
/* add day form in modal */
.adf{background:var(--sf2);border:1px solid var(--gold2);border-radius:12px;padding:.9rem 1.1rem;margin-bottom:.8rem;display:none;}
.adf.open{display:block;}
.adfrow{display:flex;gap:7px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px;}
.adfg{display:flex;flex-direction:column;gap:3px;}
.adfg label{font-size:.68rem;color:var(--mut);}
.adfg input{background:var(--sf);border:1px solid var(--br);border-radius:7px;padding:6px 9px;color:var(--tx);font-family:'Tajawal',sans-serif;font-size:.82rem;outline:none;transition:border-color .2s;}
.adfg input:focus{border-color:var(--gold2);}
.adf-acts{display:flex;gap:6px;justify-content:flex-end;}
/* totals */
.totbox{margin-top:.8rem;background:var(--sf2);border:1px solid var(--br);border-radius:11px;padding:10px 14px;display:flex;align-items:center;justify-content:space-around;flex-wrap:wrap;gap:8px;}
.toti{text-align:center;}
.totn{font-family:'Cairo',sans-serif;font-weight:800;font-size:1.15rem;color:var(--brown);}
.totl{color:var(--mut);font-size:.67rem;margin-top:1px;}
/* tasks */
.th2{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;}
.th2 h3{font-family:'Cairo',sans-serif;font-size:.88rem;font-weight:700;color:var(--tx);}
.atbtn{padding:5px 12px;border-radius:9px;background:linear-gradient(135deg,var(--brown),var(--gold2));color:#fff;border:none;font-family:'Tajawal',sans-serif;font-size:.74rem;cursor:pointer;}
.atbtn.hidden{display:none;}
.tf{background:var(--sf2);border:1px solid var(--gold2);border-radius:12px;padding:.9rem 1.1rem;margin-bottom:.8rem;display:none;}
.tf.open{display:block;}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px;}
.bsv{padding:6px 15px;background:linear-gradient(135deg,var(--brown),var(--gold2));color:#fff;border:none;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:.78rem;cursor:pointer;}
.bcn{padding:6px 12px;background:transparent;color:var(--mut);border:1px solid var(--br);border-radius:8px;font-family:'Tajawal',sans-serif;font-size:.78rem;cursor:pointer;}
.tlist{display:flex;flex-direction:column;gap:6px;}
.ti{background:var(--sf2);border:1px solid var(--br);border-radius:11px;padding:10px 12px;display:flex;align-items:flex-start;gap:8px;animation:fup .28s ease both;}
.ti.done{opacity:.5;}.ti.done .tit{text-decoration:line-through;color:var(--mut);}
.tchk{width:19px;height:19px;border-radius:5px;border:2px solid var(--br2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .2s;font-size:.64rem;}
.tchk:hover{border-color:var(--grn2);}
.ti.done .tchk{background:var(--grn);border-color:var(--grn);color:#fff;}
.tibody{flex:1;}
.tit{font-weight:600;font-size:.84rem;color:var(--tx);margin-bottom:2px;}
.tmeta{display:flex;gap:5px;flex-wrap:wrap;}
.ttag{font-size:.65rem;padding:1px 6px;border-radius:8px;}
.tag-hw{background:rgba(90,62,32,.1);color:var(--gold);}
.tag-read{background:rgba(58,94,64,.1);color:var(--grn);}
.tag-proj{background:rgba(80,55,25,.1);color:var(--br2c);}
.tag-exam{background:rgba(122,32,32,.1);color:var(--red2);}
.tag-other{background:rgba(100,86,68,.1);color:var(--mut);}
.tidue{font-size:.67rem;color:var(--mut);}
.tidue.late{color:var(--red2);}
.tidel{width:22px;height:22px;border-radius:5px;border:1px solid var(--br);background:transparent;cursor:pointer;color:var(--mut);font-size:.7rem;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.tidel:hover{border-color:var(--red2);color:var(--red2);}
/* info/notes */
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:1rem;}
.ig{display:flex;flex-direction:column;gap:3px;}
.ig label{font-size:.7rem;color:var(--mut);}
.ig input{background:var(--sf2);border:1px solid var(--br);border-radius:8px;padding:7px 10px;color:var(--tx);font-family:'Tajawal',sans-serif;font-size:.83rem;outline:none;transition:border-color .2s;}
.ig input:focus{border-color:var(--gold2);}
.ig input:read-only{cursor:default;opacity:.65;}
.notesta{width:100%;background:var(--sf2);border:1px solid var(--br);border-radius:10px;padding:9px 12px;color:var(--tx);font-family:'Tajawal',sans-serif;font-size:.83rem;min-height:110px;outline:none;resize:vertical;transition:border-color .2s;line-height:1.75;}
.notesta:focus{border-color:var(--gold2);}
/* QR */
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:.8rem;padding:1rem 0;}
#qrCanvas{border-radius:10px;border:1px solid var(--br);}
/* LEADERBOARD */
#lbView{display:none;padding:1.5rem;}
.lb-header{text-align:center;margin-bottom:1.5rem;}
.lb-header h2{font-family:'Amiri',serif;font-size:1.8rem;color:var(--brown);}
.lb-header p{color:var(--mut);font-size:.84rem;margin-top:4px;}
.lb-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;}
.lbcard{background:var(--sf);border:1.5px solid var(--br);border-radius:16px;padding:1.1rem;text-align:center;position:relative;overflow:hidden;transition:transform .2s;}
.lbcard:hover{transform:translateY(-2px);}
.lbcard.gold-c{border-color:#c9973a;background:linear-gradient(160deg,#fff9ee,var(--sf));}
.lbcard.silver-c{border-color:#a0a0a0;}
.lbcard.bronze-c{border-color:#cd7f32;}
.lbcard .rank{position:absolute;top:8px;right:10px;font-family:'Cairo',sans-serif;font-weight:900;font-size:.8rem;color:var(--mut);}
.lbcard .lav{width:52px;height:52px;border-radius:14px;margin:0 auto .7rem;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:800;color:#fff;}
.lbcard .lnm{font-family:'Cairo',sans-serif;font-weight:700;font-size:.88rem;color:var(--tx);margin-bottom:3px;}
.lbcard .lpts{font-family:'Cairo',sans-serif;font-weight:900;font-size:1.4rem;color:var(--brown);}
.lbcard .lptsl{color:var(--mut);font-size:.65rem;}
.trophy{font-size:1.4rem;}
/* DISPLAY MODE */
#displayView{display:none;background:var(--bg);padding:1rem;}
.dv-header{text-align:center;margin-bottom:1rem;}
.dv-header h1{font-family:'Amiri',serif;font-size:2rem;color:var(--brown);}
.dv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.7rem;}
.dvcard{background:var(--sf);border:1.5px solid var(--br);border-radius:14px;padding:.9rem .8rem;text-align:center;}
.dvcard .dav{width:44px;height:44px;border-radius:12px;margin:0 auto .5rem;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:800;color:#fff;}
.dvcard .dnm{font-family:'Cairo',sans-serif;font-weight:700;font-size:.8rem;color:var(--tx);margin-bottom:4px;}
.dvcard .dpts{font-family:'Cairo',sans-serif;font-weight:900;font-size:1.5rem;color:var(--brown);}
/* QR SCANNER */
#scanView{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;}
#scanView.open{display:flex;}
#scanVideo{border-radius:16px;max-width:340px;width:100%;}
.scan-close{padding:8px 22px;background:#fff;color:var(--brown);border:none;border-radius:20px;font-family:'Cairo',sans-serif;font-weight:700;cursor:pointer;}
/* CONFIRM */
.cfbox{background:var(--sf);border:1.5px solid var(--br);border-radius:16px;padding:1.4rem 1.6rem;max-width:360px;width:100%;}
.cfbox h3{font-family:'Cairo',sans-serif;font-size:.95rem;font-weight:700;margin-bottom:.5rem;}
.cfbox p{color:var(--mut);font-size:.82rem;margin-bottom:1.1rem;}
.cfacts{display:flex;gap:7px;justify-content:flex-end;}
/* STUDENT DASH */
#sDash{display:none;}
.sdh{background:var(--sf);border:1.5px solid var(--br);border-radius:18px;padding:1.4rem 1.6rem;margin-bottom:1.2rem;display:flex;align-items:center;gap:1.1rem;box-shadow:0 3px 14px rgba(90,62,32,.07);}
.sdh-av{width:54px;height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:800;flex-shrink:0;}
.sdh-info h2{font-family:'Cairo',sans-serif;font-size:1.1rem;font-weight:700;}
.sdh-info p{color:var(--mut);font-size:.8rem;margin-top:2px;}
.sdstats{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-bottom:1.2rem;}
.sdsc{background:var(--sf);border:1px solid var(--br);border-radius:13px;padding:.8rem .9rem;text-align:center;position:relative;overflow:hidden;}
.sdsc::before{content:'';position:absolute;top:0;inset-inline:0;height:2px;background:var(--sa,var(--gold2));}
.sdsc-n{font-family:'Cairo',sans-serif;font-size:1.4rem;font-weight:900;color:var(--brown);}
.sdsc-l{color:var(--mut);font-size:.68rem;margin-top:1px;}
/* week filter */
.wf{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:.9rem;}
.wfb{padding:4px 11px;border-radius:16px;border:1px solid var(--br);background:transparent;color:var(--mut);font-family:'Tajawal',sans-serif;font-size:.73rem;cursor:pointer;transition:all .2s;}
.wfb.on{background:rgba(90,62,32,.1);border-color:var(--gold2);color:var(--brown);}
/* max-per-day badge */
.maxday-badge{font-size:.7rem;color:var(--mut);background:var(--sf2);border:1px solid var(--br);border-radius:20px;padding:3px 10px;}
@media(max-width:900px){.gcrow{grid-template-columns:1fr;}.sdstats{grid-template-columns:repeat(2,1fr);}.igrid{grid-template-columns:1fr;}.tfrow{grid-template-columns:1fr;}}
@media(max-width:600px){#mainView{padding:1rem;}.tcard th:nth-child(n+5):nth-child(-n+8),.tcard td:nth-child(n+5):nth-child(-n+8){display:none;}}
</style>
</head>

function sd(){localStorage.setItem(SK,JSON.stringify({tPass,groups,students,pts,tasks,notes,cWeek}));}

let groups={A:{name:'المجموعة الأولى',icon:'📐'},B:{name:'المجموعة الثانية',icon:'📏'}};
let students=[];
let pts={};  // pts[id]=[{id,label,date,week,maxDay,attend,early,recite,uniform}]

let notes={};

let curUser=null;
let curId=null;
let grpFilter='';
let selectedDayId='all'; // 'all' or day.id

// ════════ INIT ════════
window.addEventListener('DOMContentLoaded', function(){
  const d=ld();
  if(d&&d.tPass){
    tPass=d.tPass; groups=d.groups||groups; students=d.students||[];
    pts=d.pts||{}; tasks=d.tasks||{}; notes=d.notes||{}; cWeek=d.cWeek||1;
    students.forEach(s=>{if(!pts[s.id])pts[s.id]=[];if(!tasks[s.id])tasks[s.id]=[];if(!notes[s.id])notes[s.id]='';});
    $('SP').style.display='none';
    $('LP').style.display='flex';
    fillSSelect();
  } else {
    $('SP').style.display='flex';
    $('LP').style.display='none';
  }
});

// day calculations
const dayTot=d=>d.attend+d.early+d.recite+d.uniform;
function isActiveDay(d){return d.week===cWeek||d.week===cWeek-1;}
function studentWeekPts(sid,w){return(pts[sid]||[]).filter(d=>d.week===w).reduce((s,d)=>s+dayTot(d),0);}
function studentActivePts(sid){return(pts[sid]||[]).filter(d=>isActiveDay(d)).reduce((s,d)=>s+dayTot(d),0);}
function studentAllPts(sid){return(pts[sid]||[]).reduce((s,d)=>s+dayTot(d),0);}
function pctGrade(active,maxActive){if(!maxActive)return 0;return active/maxActive*100;}
function grade(p){if(p>=85)return{l:'ممتاز',c:'gA'};if(p>=70)return{l:'جيد',c:'gB'};if(p>=55)return{l:'مقبول',c:'gC'};return{l:'ضعيف',c:'gD'};}

// unique days across all students (for day selector)
function getAllDays(){
  const map={};
  students.forEach(s=>(pts[s.id]||[]).forEach(d=>{if(!map[d.id])map[d.id]=d;}));
  return Object.values(map).sort((a,b)=>(a.date||a.label).localeCompare(b.date||b.label));
}

let ltab='t';
function switchLT(t,btn){
  ltab=t;document.querySelectorAll('.ltab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');

function doLogin(t){
  if(t==='t'){
    if($('tp').value===tPass){curUser={type:'t'};launchApp();}
    else{const e=$('te');e.style.display='block';setTimeout(()=>e.style.display='none',3000);}
  } else {
    const sid=parseInt($('ss').value),pw=$('sp').value;
    if(!sid){const e=$('se2');e.textContent='اختر اسمك';e.style.display='block';return;}
    const s=students.find(x=>x.id===sid);
    if(!s||!s.password){const e=$('se2');e.textContent='لم تُعيَّن كلمة مرور بعد';e.style.display='block';return;}
    if(pw===s.password){curUser={type:'s',id:sid};launchApp();}
    else{const e=$('se2');e.textContent='كلمة المرور غير صحيحة';e.style.display='block';setTimeout(()=>e.style.display='none',3000);}
  }
}

// ════════ TABLE ════════
function renderTable(){
  const th=$('thead'),tb=$('tbody');
  const isT=curUser?.type==='t';
  const filt=students.filter(s=>!grpFilter||s.grp===grpFilter);
  // build header
  let hrow='<tr><th style="text-align:right">الطالب</th>';
  if(selectedDayId==='all'){
    hrow+='<th>أسبوع '+cWeek+'</th>'+(cWeek>1?'<th>أسبوع '+(cWeek-1)+'</th>':'')+'<th>الفعّال</th>';
  } else {
    hrow+='<th>حضور</th><th>مبكر</th><th>تسميع</th><th>الزي</th><th>المجموع</th>';
  }
  hrow+='<th>التقدير</th>';
  if(isT) hrow+='<th>إجراءات</th>';
  hrow+='</tr>';
  th.innerHTML=hrow;
  tb.innerHTML='';
  filt.forEach((s,i)=>{
    const sdPts=pts[s.id]||[];
    const act=studentActivePts(s.id);
    const w1=studentWeekPts(s.id,cWeek);
    const w2=studentWeekPts(s.id,cWeek-1);
    const maxAct=sdPts.filter(d=>isActiveDay(d)).reduce((a,d)=>a+d.maxDay,0)||1;
    const pct=act/maxAct*100;
    const g=grade(pct);
    const tl=tasks[s.id]||[];const pending=tl.filter(t=>!t.done).length;
    const row=document.createElement('tr');
    row.style.animationDelay=(i*.025)+'s';row.dataset.name=s.name;row.dataset.grp=s.grp;
    let cells=`<td><div class="snc" onclick="${isT?`openStuModal(${s.id})`:`''`}">
      <div class="sav" style="background:${s.color}1a;color:${s.color}">${ini(s.name)}</div>
      <div><div class="snm">${s.name}</div><div class="scod">${s.code} <span class="gtag ${s.grp}">${groups[s.grp].name}</span></div>
      ${tl.length>0?`<div style="font-size:.62rem;color:var(--br2c);margin-top:1px">📋${tl.length}${pending?' · '+pending+' معلق':''}</div>`:''}</div>
    </div></td>`;
    if(selectedDayId==='all'){
      cells+=`<td class="tot-num">${w1}</td>`+(cWeek>1?`<td style="color:var(--mut);font-family:'Cairo',sans-serif;font-weight:600">${w2||'—'}</td>`:'')+`<td class="tot-num">${act}</td>`;
    } else {
      const d=sdPts.find(x=>x.id===selectedDayId);
      if(isT&&d){
        cells+=`
          <td><input class="pi" type="number" min="0" max="5" value="${d.attend}" onchange="inlineUp(${s.id},'${d.id}','attend',this.value)"></td>
          <td><input class="pi" type="number" min="0" max="5" value="${d.early}"  onchange="inlineUp(${s.id},'${d.id}','early',this.value)"></td>
          <td><input class="pi" type="number" min="0" max="5" value="${d.recite}" onchange="inlineUp(${s.id},'${d.id}','recite',this.value)"></td>
          <td><input class="pi" type="number" min="0" max="5" value="${d.uniform}"onchange="inlineUp(${s.id},'${d.id}','uniform',this.value)"></td>
          <td><span class="day-sum">${dayTot(d)}/${d.maxDay}</span></td>`;
      } else if(d){
        cells+=`<td>${d.attend}/5</td><td>${d.early}/5</td><td>${d.recite}/5</td><td>${d.uniform}/5</td><td><span class="day-sum">${dayTot(d)}/${d.maxDay}</span></td>`;
      } else {
        cells+=`<td colspan="5" style="color:var(--mut2);font-size:.76rem;text-align:center">${isT?`<button class="add-day-btn" onclick="openStuModal(${s.id})" style="font-size:.7rem">+ إضافة</button>`:'—'}</td>`;
      }
    }
    cells+=`<td><span class="gbadge ${g.c}">${g.l}</span></td>`;
    if(isT) cells+=`<td><div class="acts">
      <button class="ab" onclick="openStuModal(${s.id})" title="ملف">👤</button>
      <button class="ab del" onclick="confirmDel(${s.id})" title="حذف">🗑</button>
    </div></td>`;
    row.innerHTML=cells;tb.appendChild(row);
  });
  updateStats();renderGroups();
}

function inlineUp(sid,dayId,field,val){
  const d=(pts[sid]||[]).find(x=>x.id===dayId);
  if(d){d[field]=Math.max(0,Math.min(5,parseInt(val)||0));sd();renderGroups();renderDisplay();}
}

function filterTable(q){document.querySelectorAll('#tbody tr').forEach(r=>{r.style.display=(r.dataset.name?.includes(q)&&(!grpFilter||r.dataset.grp===grpFilter))?'':'none';});}

  $('recGrid').innerHTML='';recRows=[];

}
function initRecDay(){
  const grpF=$('rec-g').value;
  const filt=students.filter(s=>grpF==='all'||s.grp===grpF);
  recRows=filt.map(s=>({sid:s.id,attend:0,early:0,recite:0,uniform:0}));
  const g=$('recGrid');g.innerHTML='';
  filt.forEach((s,i)=>{
    const div=document.createElement('div');div.className='prow';
    div.innerHTML=`<div class="plbl">${s.name}</div>
      <div class="pfields">
        <div class="pf"><label>حضور</label><input class="mpinp" type="number" min="0" max="5" value="0" onchange="recRows[${i}].attend=Math.max(0,Math.min(5,+this.value||0))"></div>
        <div class="pf"><label>مبكر</label><input class="mpinp" type="number" min="0" max="5" value="0" onchange="recRows[${i}].early=Math.max(0,Math.min(5,+this.value||0))"></div>
        <div class="pf"><label>تسميع</label><input class="mpinp" type="number" min="0" max="5" value="0" onchange="recRows[${i}].recite=Math.max(0,Math.min(5,+this.value||0))"></div>
        <div class="pf"><label>الزي</label><input class="mpinp" type="number" min="0" max="5" value="0" onchange="recRows[${i}].uniform=Math.max(0,Math.min(5,+this.value||0))"></div>
      </div>`;
    g.appendChild(div);
  });
}
function saveRecDay(){
  const lbl=$('rec-n').value.trim();if(!lbl){showToast('⚠️ أدخل اسم اليوم');return;}
  const dt=$('rec-dt').value,w=parseInt($('rec-w').value)||cWeek,mx=parseInt($('rec-mx').value)||20;
  const baseId='d'+Date.now();
  recRows.forEach((r,i)=>{
    const day={id:baseId+'_'+r.sid,label:lbl,date:dt,week:w,maxDay:mx,attend:r.attend,early:r.early,recite:r.recite,uniform:r.uniform};
    pts[r.sid]=pts[r.sid]||[];
    const ex=(pts[r.sid]).findIndex(d=>d.label===lbl&&d.week===w);
    if(ex>=0)pts[r.sid][ex]=day; else pts[r.sid].push(day);
  });
  sd();closeOv('recOv');renderAll();showToast('✅ تم رصد اليوم لـ '+recRows.length+' طالب');
}

  filt.forEach(d=>{

    const row=document.createElement('div');row.className='prow'+(arc?' arc':'');
    row.innerHTML=`<div class="plbl">${d.date?'<span style="font-size:.62rem;color:var(--mut)">'+fmtD(d.date)+'</span> ':''}${d.label}</div>
      <div class="pfields">

function upMDay(dayId,field,val){
  const s=findS(curId);const d=(pts[s.id]||[]).find(x=>x.id===dayId);
  if(d){d[field]=Math.max(0,Math.min(5,parseInt(val)||0));renderMPGrid();renderTable();sd();}
}
function editMaxDay(dayId,cur){
  const nv=prompt(`تعديل حد هذا اليوم (الحالي: ${cur}):`,cur);
  if(nv===null)return;const n=Math.max(1,parseInt(nv)||cur);
  const s=findS(curId);const d=(pts[s.id]||[]).find(x=>x.id===dayId);
  if(d){d.maxDay=n;renderMPGrid();renderTable();sd();showToast('✅ تم تعديل الحد إلى '+n);}
}
function delMDay(dayId){const s=findS(curId);pts[s.id]=(pts[s.id]||[]).filter(x=>x.id!==dayId);renderMWF();renderMPGrid();renderTable();renderDayPills();sd();showToast('🗑 تم حذف اليوم');}

function renderMTot(){
  const s=findS(curId);const all=pts[s.id]||[];
  const w1=studentWeekPts(s.id,cWeek);const w2=studentWeekPts(s.id,cWeek-1);
  const act=studentActivePts(s.id);const grand=studentAllPts(s.id);
  $('mTotBox').innerHTML=`
    <div class="toti"><div class="totn">${w1}</div><div class="totl">أسبوع ${cWeek}</div></div>
    <div class="toti"><div class="totn">${cWeek>1?w2:'—'}</div><div class="totl">${cWeek>1?'أسبوع '+(cWeek-1):'—'}</div></div>
    <div class="toti"><div class="totn">${act}</div><div class="totl">الفعّال</div></div>
    <div class="toti"><div class="totn" style="color:var(--mut)">${grand}</div><div class="totl">الكل (مع المحفوظ)</div></div>`;
}

// ════════ ADD DAY IN MODAL ════════
function toggleADF(){const f=$('adf');f.classList.toggle('open');if(f.classList.contains('open'))$('adf-n').focus();}
function addModalDay(){
  const lbl=$('adf-n').value.trim();if(!lbl){showToast('⚠️ أدخل اسم اليوم');return;}
  const s=findS(curId);
  const day={id:'d'+Date.now(),label:lbl,date:$('adf-dt').value,week:parseInt($('adf-w').value)||cWeek,
    maxDay:parseInt($('adf-mx').value)||20,
    attend:Math.min(5,parseInt($('adf-a').value)||0),early:Math.min(5,parseInt($('adf-e').value)||0),
    recite:Math.min(5,parseInt($('adf-r').value)||0),uniform:Math.min(5,parseInt($('adf-u').value)||0)};
  pts[s.id]=pts[s.id]||[];pts[s.id].push(day);
  ['adf-n','adf-a','adf-e','adf-r','adf-u'].forEach(id=>$(id).value=id==='adf-n'?'':'0');
  $('adf').classList.remove('open');
  renderMWF();renderMPGrid();renderTable();renderDayPills();sd();showToast('✅ تم إضافة اليوم');
}

// ════════ TASKS ════════
function renderTasks(){
  const isT=curUser?.type==='t';
  const list=tasks[curId]||[];const el=$('tList');
  if(!list.length){el.innerHTML='<div style="text-align:center;padding:1.5rem;color:var(--mut2)">📭 لا توجد مهام</div>';return;}
  el.innerHTML='';
  list.forEach((t,i)=>{
    const ti=TI(t.type);const over=isLate(t.due)&&!t.done;
    const d=document.createElement('div');d.className='ti'+(t.done?' done':'');d.style.animationDelay=(i*.04)+'s';
    d.innerHTML=`<button class="tchk" onclick="togTask('${t.id}')">${t.done?'✓':''}</button>
      <div class="tibody"><div class="tit">${t.title}</div>
        <div class="tmeta"><span class="ttag ${ti.c}">${ti.l}</span>
          ${t.due?`<span class="tidue${over?' late':''}">📅 ${fmtD(t.due)}${over?' · متأخرة':''}</span>`:''}
        </div>${t.desc?`<div style="font-size:.72rem;color:var(--mut);margin-top:3px">${t.desc}</div>`:''}</div>
      ${isT?`<button class="tidel" onclick="delTask('${t.id}')">🗑</button>`:''}`;
    el.appendChild(d);
  });
}
function toggleTF(){const f=$('tForm');f.classList.toggle('open');if(f.classList.contains('open')){$('tft').focus();const t=new Date();t.setDate(t.getDate()+1);$('tfd').value=t.toISOString().split('T')[0];}}
function saveTask(){const ttl=$('tft').value.trim();if(!ttl){showToast('⚠️ أدخل عنوان المهمة');return;}
  tasks[curId].push({id:'t'+Date.now(),title:ttl,type:$('tfty').value,due:$('tfd').value,desc:$('tfds').value.trim(),done:false});
  $('tft').value='';$('tfds').value='';$('tForm').classList.remove('open');renderTasks();renderTable();sd();showToast('✅ تمت إضافة المهمة');}
function togTask(tid){const t=(tasks[curId]||[]).find(x=>x.id===tid);if(t){t.done=!t.done;renderTasks();renderTable();sd();if(curUser?.type==='s')renderStudentDash(curId);showToast(t.done?'✅ تم الإنجاز!':'↩️ تم التراجع');}}
function delTask(tid){tasks[curId]=tasks[curId].filter(x=>x.id!==tid);renderTasks();renderTable();sd();}

// ════════ INFO ════════
function saveInfo(){
  const s=findS(curId);if(!s)return;
  s.name=$('in-nm').value.trim()||s.name;
  const nu=$('in-un').value.trim(),np=$('in-pw').value.trim();
  if(nu)s.username=nu;if(np)s.password=np;s.par=$('in-par').value.trim();
  $('mNI').value=s.name;$('mAv').textContent=ini(s.name);
  fillSSelect();renderTable();sd();showToast('✅ تم حفظ البيانات');
}
function saveNotes(){notes[curId]=$('notesTA').value;sd();showToast('✅ تم حفظ الملاحظات');}

// ════════ ADD STUDENT ════════
function addStudent(){
  const n=$('as-n').value.trim(),g=$('as-g').value,u=$('as-u').value.trim(),p=$('as-p').value.trim(),par=$('as-par').value.trim();
  if(!n){showToast('⚠️ أدخل الاسم');return;}if(!u){showToast('⚠️ أدخل اليوزر');return;}if(!p){showToast('⚠️ أدخل كلمة المرور');return;}
  if(students.find(s=>s.username===u)){showToast('⚠️ اليوزر مستخدم مسبقاً');return;}
  const id=students.length>0?Math.max(...students.map(s=>s.id))+1:1;
  const s={id,name:n,code:'S-'+String(id).padStart(2,'0'),grp:g,color:COLORS[(id-1)%COLORS.length],par,username:u,password:p};
  students.push(s);pts[s.id]=[];tasks[s.id]=[];notes[s.id]='';
  ['as-n','as-u','as-p','as-par'].forEach(id=>$(id).value='');
  closeOv('addOv');fillSSelect();renderAll();sd();showToast(`✅ تم إضافة ${n}`);
}

// ════════ DELETE STUDENT ════════
function confirmDel(sid){
  const s=findS(sid);
  $('cfT').textContent='حذف الطالب';$('cfM').textContent=`هل أنت متأكد من حذف "${s.name}"؟`;
  $('cfOk').onclick=()=>{students=students.filter(x=>x.id!==sid);delete pts[sid];delete tasks[sid];delete notes[sid];fillSSelect();renderAll();closeOv('cfOv');sd();showToast('🗑 تم الحذف');};
  openOv('cfOv');
}

// ════════ QR ════════
function renderQR(id){
  const el=$('qrCanvas');el.innerHTML='';
  const url=window.location.href.split('?')[0]+'?stu='+id;
  try{new QRCode(el,{text:url,width:180,height:180,colorDark:'#5a3e20',colorLight:'#faf5ed',correctLevel:QRCode.CorrectLevel.M});}catch(e){el.textContent='QR غير متاح';}
}
function downloadQR(){
  const canvas=$('qrCanvas').querySelector('canvas');
  if(!canvas){showToast('⚠️ أعد فتح تبويب QR');return;}
  const a=document.createElement('a');a.download='qr-student.png';a.href=canvas.toDataURL();a.click();
}
// check URL for QR deep link
function checkQRLink(){
  const p=new URLSearchParams(window.location.search);const sid=parseInt(p.get('stu'));
  if(sid&&curUser?.type==='t'){openStuModal(sid);}
}

// ════════ QR SCANNER ════════
let scanStream=null,scanInterval=null;
function openScanner(){
  $('scanView').classList.add('open');
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(stream=>{
    scanStream=stream;const v=$('scanVideo');v.srcObject=stream;
    const cvs=$('scanCanvas');const ctx=cvs.getContext('2d');
    scanInterval=setInterval(()=>{
      if(v.readyState===v.HAVE_ENOUGH_DATA){
        cvs.width=v.videoWidth;cvs.height=v.videoHeight;ctx.drawImage(v,0,0);
        const img=ctx.getImageData(0,0,cvs.width,cvs.height);
        const code=jsQR(img.data,img.width,img.height);
        if(code){closeScanner();const u=new URL(code.data);const sid=parseInt(u.searchParams.get('stu'));if(sid){if(curUser?.type==='t')openStuModal(sid);else showToast('فتح ملف الطالب: '+sid);}}
      }},300);
  }).catch(()=>showToast('⚠️ تعذّر الوصول إلى الكاميرا'));
}
function closeScanner(){
  $('scanView').classList.remove('open');
  if(scanStream)scanStream.getTracks().forEach(t=>t.stop());
  if(scanInterval)clearInterval(scanInterval);scanStream=null;scanInterval=null;
}

// ════════ LEADERBOARD ════════
function renderLB(mode,btn){
  document.querySelectorAll('#lbFilters .wfb').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');
  const getPts=s=>mode==='all'?studentAllPts(s.id):mode==='week'?studentWeekPts(s.id,cWeek):studentActivePts(s.id);
  const lbl=mode==='all'?'الكل':mode==='week'?'الأسبوع '+cWeek:'الفعّال (أسبوعين)';
  $('lbSub').textContent='ترتيب '+lbl;
  // Individual
  const sorted=[...students].map(s=>({...s,pts:getPts(s)})).sort((a,b)=>b.pts-a.pts);
  const maxPts=sorted[0]?.pts||1;
  const medals=['🥇','🥈','🥉'];const medalC=['gold-c','silver-c','bronze-c'];
  $('lbIndividual').innerHTML=sorted.map((s,i)=>`
    <div class="lbcard ${i<3?medalC[i]:''}">
      <div class="rank">${i+1}</div>
      ${i<3?`<div class="trophy">${medals[i]}</div>`:''}
      <div class="lav" style="background:${s.color}">${ini(s.name)}</div>
      <div class="lnm">${s.name}</div>
      <div class="lpts">${s.pts}</div>
      <div class="lptsl">${lbl}</div>
      ${i===0?'<div style="font-size:1rem;margin-top:4px">⭐ النجم</div>':''}
    </div>`).join('');
  // Groups
  const grpData=['A','B'].map(gid=>{
    const stus=students.filter(s=>s.grp===gid);
    const total=stus.reduce((s,st)=>s+getPts(st),0);
    return{gid,name:groups[gid].name,total,count:stus.length,icon:groups[gid].icon};
  }).sort((a,b)=>b.total-a.total);
  $('lbGroups').innerHTML=grpData.map((g,i)=>`
    <div class="lbcard ${i===0?'gold-c':''}" style="max-width:250px">
      ${i===0?'<div class="trophy">🏆</div>':''}
      <div style="font-size:2rem;margin-bottom:.5rem">${g.icon}</div>
      <div class="lnm">${g.name}</div>
      <div class="lpts">${g.total}</div>
      <div class="lptsl">إجمالي ${lbl}</div>
      ${i===0?'<div style="font-size:.8rem;margin-top:4px;color:var(--gold)">🏆 الفائزة</div>':''}
    </div>`).join('');
}

// ════════ DISPLAY VIEW ════════
function renderDisplay(){
  const sorted=[...students].map(s=>({...s,pts:studentActivePts(s.id)})).sort((a,b)=>b.pts-a.pts);
  $('dvSub').textContent='نقاط الأسبوعين الفعّالة';
  $('dvGrid').innerHTML=sorted.map((s,i)=>`
    <div class="dvcard">
      <div class="dav" style="background:${s.color}">${ini(s.name)}</div>
      <div class="dnm">${s.name}</div>
      <div class="dpts">${s.pts}</div>
      <div style="font-size:.68rem;color:var(--mut)">${groups[s.grp].name}</div>
    </div>`).join('');
}

// ════════ STUDENT DASHBOARD ════════
function renderStudentDash(id){
  const s=findS(id);const sdPts=pts[id]||[];
  const w1=studentWeekPts(id,cWeek);const w2=studentWeekPts(id,cWeek-1);
  const act=studentActivePts(id);const g=grade(act/(sdPts.filter(d=>isActiveDay(d)).reduce((a,d)=>a+d.maxDay,0)||1)*100);
  $('sdHdr').innerHTML=`<div class="sdh-av" style="background:${s.color}1a;color:${s.color}">${ini(s.name)}</div>
    <div class="sdh-info"><h2>${s.name}</h2><p>${s.code} · ${groups[s.grp].name}</p></div>`;
  $('sdStats').innerHTML=`
    <div class="sdsc" style="--sa:var(--gold2)"><div class="sdsc-n">${w1}</div><div class="sdsc-l">أسبوع ${cWeek}</div></div>
    <div class="sdsc" style="--sa:var(--mut)"><div class="sdsc-n">${cWeek>1?w2:'—'}</div><div class="sdsc-l">${cWeek>1?'أسبوع '+(cWeek-1):'—'}</div></div>
    <div class="sdsc" style="--sa:var(--grn)"><div class="sdsc-n">${act}</div><div class="sdsc-l">الفعّال</div></div>
    <div class="sdsc" style="--sa:var(--br2c)"><div class="sdsc-n"><span class="gbadge ${g.c}">${g.l}</span></div><div class="sdsc-l">تقديري</div></div>`;
  renderSDPts(id);renderSDTasks(id);
}
function switchSD(n,btn){document.querySelectorAll('.ltab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');$('sdPts').style.display=n==='pts'?'block':'none';$('sdTasks').style.display=n==='tasks'?'block':'none';}
function renderSDPts(id){
  const all=pts[id]||[];
  const weeks=[...new Set(all.map(d=>d.week))].sort((a,b)=>b-a);
  let html='';
  if(!all.length){$('sdPts').innerHTML='<div style="text-align:center;padding:2rem;color:var(--mut2)">لا توجد نقاط بعد</div>';return;}
  weeks.forEach(w=>{
    const act=isActiveDay({week:w});
    html+=`<div style="margin-bottom:1rem"><div style="font-family:Cairo,sans-serif;font-weight:700;font-size:.86rem;color:${act?'var(--brown)':'var(--mut)'};margin-bottom:.5rem">أسبوع ${w} ${!act?'<span style="font-size:.68rem;color:var(--mut2)">(محفوظ)</span>':''}</div><div class="pts-grid">`;
    all.filter(d=>d.week===w).forEach(d=>{
      html+=`<div class="prow${!act?' arc':''}">
        <div class="plbl">${d.date?'<span style="font-size:.6rem;color:var(--mut)">'+fmtD(d.date)+'</span> ':''}${d.label}</div>
        <div class="pfields">
          <div class="pf"><label>حضور</label><div style="font-family:Cairo,sans-serif;font-weight:700">${d.attend}/5</div></div>
          <div class="pf"><label>مبكر</label><div style="font-family:Cairo,sans-serif;font-weight:700">${d.early}/5</div></div>
          <div class="pf"><label>تسميع</label><div style="font-family:Cairo,sans-serif;font-weight:700">${d.recite}/5</div></div>
          <div class="pf"><label>الزي</label><div style="font-family:Cairo,sans-serif;font-weight:700">${d.uniform}/5</div></div>
          <span class="ptot">${dayTot(d)}/${d.maxDay}</span>
        </div></div>`;
    });
    html+='</div></div>';
  });
  $('sdPts').innerHTML=html;
}
function renderSDTasks(id){
  curId=id;const list=tasks[id]||[];
  let html='<div class="th2"><h3>مهامي</h3></div>';
  if(!list.length){html+='<div style="text-align:center;padding:1.5rem;color:var(--mut2)">📭 لا توجد مهام بعد</div>';$('sdTasks').innerHTML=html;return;}
  html+='<div class="tlist">';
  list.forEach((t,i)=>{
    const ti=TI(t.type);const over=isLate(t.due)&&!t.done;
    html+=`<div class="ti${t.done?' done':''}">
      <button class="tchk" onclick="sdTogTask('${t.id}',${id})">${t.done?'✓':''}</button>
      <div class="tibody"><div class="tit">${t.title}</div>
        <div class="tmeta"><span class="ttag ${ti.c}">${ti.l}</span>
          ${t.due?`<span class="tidue${over?' late':''}">📅 ${fmtD(t.due)}${over?' · متأخرة':''}</span>`:''}
        </div></div></div>`;
  });
  html+='</div>';$('sdTasks').innerHTML=html;
}
function sdTogTask(tid,sid){const t=(tasks[sid]||[]).find(x=>x.id===tid);if(t){t.done=!t.done;sd();renderStudentDash(sid);showToast(t.done?'✅ تم الإنجاز!':'↩️ تم التراجع');}}

// ════════ MODAL HELPERS ════════
function openOv(id){$(id).classList.add('open');document.body.style.overflow='hidden';}
function closeOv(id){$(id).classList.remove('open');document.body.style.overflow='';}
function bgClose(e,id){if(e.target===$(id))closeOv(id);}

// ════════ CHECK QR LINK ON LOAD ════════
window.addEventListener('load',()=>setTimeout(checkQRLink,500));
</script>
